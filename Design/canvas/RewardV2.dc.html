<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Квест выполнен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5214}a:hover{color:#7A3F0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; background: #F5F0E6; color: #1F2A44; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;">
  <div style="height: 170px; border-radius: 20px; background: #E7DCC4; position: relative; overflow: hidden; flex-shrink: 0;">
    <div style="position: absolute; left: 40px; top: 30px; width: 8px; height: 8px; background: #E2A04A;"></div>
    <div style="position: absolute; left: 290px; top: 46px; width: 8px; height: 8px; background: #E2A04A;"></div>
    <div style="position: absolute; left: 80px; top: 80px; width: 6px; height: 6px; background: #2F6B4F;"></div>
    <div style="position: absolute; left: 300px; top: 110px; width: 6px; height: 6px; background: #2F6B4F;"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #B9AA86; border-top: 6px solid #8E7F5C;"></div>
    <div style="position: absolute; left: 50%; bottom: 34px; margin-left: -48px; display: grid; grid-template-columns: repeat(12, 8px); grid-auto-rows: 8px;" role="img" aria-label="Персонаж радуется выполненному квесту">
      <sc-for list="{{heroPx}}" as="p" hint-placeholder-count="192"><div style="background: {{p.c}};"></div></sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; text-align: center;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2F6B4F;">Квест выполнен</div>
    <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 26px; font-weight: 700;">Сдать отчёт по проекту</h1>
  </div>

  <div style="background: #FFFCF6; border: 1px solid #E3D9C6; border-radius: 16px; padding: 6px 14px; display: flex; flex-direction: column;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5368; padding: 10px 0 4px;">Что изменилось</div>
    <sc-for list="{{changes}}" as="c" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #EFE7D7;">
        <div style="width: 44px; font-size: 13px; font-weight: 700; color: {{c.color}};">{{c.tag}}</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 15px; font-weight: 500;">{{c.title}}</div>
          <div style="font-size: 12px; color: #4A5368;">{{c.why}}</div>
        </div>
        <div style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{c.color}};">{{c.delta}}</div>
      </div>
    </sc-for>
  </div>

  <div style="font-size: 12px; color: #4A5368; text-align: center;">MNT +3,75 и CHR +2 — в «Подробнее» · MP 232 / 280</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <a href="TodayV2.dc.html" style="height: 52px; border-radius: 14px; background: #1F2A44; color: #FFFCF6; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Продолжить</a>
    <a href="TodayV2.dc.html" style="height: 44px; color: #1F2A44; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">Отменить выполнение</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const toPx = (rows, pal) => {
      const out = [];
      rows.forEach((r) => { for (const ch of r) out.push({ c: pal[ch] || 'transparent' }); });
      return out;
    };
    const hero = [
      '....HHHH....','S..HHHHHH..S','S.HHHHHHHH.S','SCHSSSSSSHCS',
      '.CSSESSESSC.','.CSSSSSSSSC.','..CSSSSSSC..','..AAAAAAAA..',
      '..CCAAAACC..','..CCCCCCCC..','..CCCBBCCC..','..CDCBBCDC..',
      '..PPPPPPPP..','..PPP..PPP..','..PPP..PPP..','.KKKK..KKKK.'
    ];
    const g = '#2F6B4F', a = '#9A5214';
    return {
      heroPx: toPx(hero, { H: '#3B2A20', S: '#E8B892', E: '#1F2A44', C: '#2F6B4F', D: '#24533D', B: '#7A4A22', P: '#3E4A63', K: '#2A2320', A: '#C9772A' }),
      changes: [
        { tag: 'FOC', title: 'Фокус', why: 'Обычный квест · средний приоритет', delta: '+5', color: a },
        { tag: 'XP', title: 'Отчётность', why: 'Навык профессии «Инженер-программист»', delta: '+10', color: a },
        { tag: 'INT', title: 'Интеллект', why: 'Основной атрибут профессии · 50%', delta: '+5', color: g },
        { tag: 'MP', title: 'Мана', why: 'Средний квест с навыком · 4 + 2', delta: '−6', color: '#3E6FA3' },
        { tag: 'Epic', title: 'Повышение до тимлида', why: 'Шаг цели выполнен', delta: '4 из 7', color: '#1F2A44' }
      ]
    };
  }
}
</script>
</body>
</html>
