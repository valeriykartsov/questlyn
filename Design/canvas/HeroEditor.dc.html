const compose = (parts) => {
  const rows = [];
  const hairless = new Set(['H', 'h', 'S', 's', 'E', '.']);
  for (let y = 0; y < 56; y++) {
    let line = '';
    for (let x = 0; x < 32; x++) {
      const core = x >= 10 && x <= 21;
      let src;
      if (y <= 23) src = parts.hair;
      else if (y <= 40) src = core ? parts.top : parts.item;
      else if (y <= 51) src = core ? parts.bottom : parts.item;
      else src = parts.shoes;
      let ch = SPRITES[src][y][x];
      if (parts.hat && y <= 14) { const h = SPRITES[parts.hat][y][x]; if (!hairless.has(h)) ch = h; }
      line += ch;

    rows.push(line);
  }
  return rows;
};

  const out = [];

        const c = pal[row[start]];
        if (c !== undefined && row[start] !== '.') out.push({ l: start * scale + 'px', t: y * scale + 'px', w: (x - start) * scale + 'px', h: scale + 'px', c: css(c) });
