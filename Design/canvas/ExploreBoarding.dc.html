<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = 30, rows = 65, cell = 13;
    const islands = [{"cx": 8, "cy": 30, "rx": 15, "ry": 26}];
    let seed = 5;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const tiles = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let best = 9;
        for (const i of islands) {
          const dx = (c - i.cx) / i.rx, dy = (r - i.cy) / i.ry;
          best = Math.min(best, Math.sqrt(dx * dx + dy * dy) + 0.07 * Math.sin(c * 0.9 + r * 0.5 + i.cx));
        }
        best += (rnd() - 0.5) * 0.14;
        let color = '#3F6E9C';
        if (best < 0.8) color = (rnd() < 0.16 ? '#5F7F45' : (rnd() < 0.5 ? '#9DB06A' : '#93A762'));
        else if (best < 0.92) color = '#E3CF9A';
        else if (best < 1.05) color = '#4F86B8';
        tiles.push({ c: color });
      }
    }
    return { tiles, cols, cell: cell + 'px', mapLabel: "\u0411\u0435\u0440\u0435\u0433 \u043e\u0441\u0442\u0440\u043e\u0432\u0430 \u00ab\u041d\u043e\u044f\u0431\u0440\u044c\u00bb \u0441 \u043a\u043e\u0440\u0430\u0431\u043b\u0451\u043c" };
  }
}
</script>
