<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — выбор профессий</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5214}a:hover{color:#7A3F0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; background: #F5F0E6; color: #1F2A44; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="OnbHero.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: #1F2A44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; gap: 6px;" aria-label="Шаг 2 из 4">
      <div style="width: 28px; height: 4px; border-radius: 2px; background: #1F2A44;"></div><div style="width: 28px; height: 4px; border-radius: 2px; background: #1F2A44;"></div><div style="width: 28px; height: 4px; border-radius: 2px; background: #D9CDB6;"></div><div style="width: 28px; height: 4px; border-radius: 2px; background: #D9CDB6;"></div>
    </div>
    <div style="width: 44px; font-size: 13px; color: #4A5368; text-align: right;">2 / 4</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.15;">Чем вы занимаетесь?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A5368;">Выберите до трёх профессий. Из них сложится ваш класс, а атрибуты профессий будут расти от квестов.</p>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: #FFFCF6; border: 1px solid #E3D9C6; color: #4A5368;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" placeholder="Поиск профессии" aria-label="Поиск профессии" style="border: none; background: transparent; outline: none; font: 15px Inter, sans-serif; color: #1F2A44; flex-grow: 1;">
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
    <sc-for list="{{profs}}" as="p" hint-placeholder-count="6">
      <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; background: #FFFCF6; border: {{p.border}}; text-align: left; font-family: Inter, sans-serif; color: #1F2A44;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 16px; font-weight: 600;">{{p.name}}</div>
          <div style="font-size: 13px; color: #4A5368;">{{p.attrs}}</div>
        </div>
        <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}">
          <div style="width: 26px; height: 26px; border-radius: 13px; background: #1F2A44; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
        </sc-if>
        <sc-if value="{{p.off}}" hint-placeholder-val="{{true}}">
          <div style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C9BCA2; box-sizing: border-box;"></div>
        </sc-if>
      </button>
    </sc-for>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; border: 1px dashed #B8A98A; background: transparent; color: #1F2A44; font: 600 15px Inter, sans-serif;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Своя профессия
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 13px; color: #4A5368; text-align: center;">Выбрано 2 из 3 · атрибуты настроите на следующем шаге</div>
    <a href="OnbAttrs.dc.html" style="height: 52px; border-radius: 14px; background: #1F2A44; color: #FFFCF6; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Далее</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Инженер-программист', attrs: 'INT · MNT · CHR', on: true },
      { name: 'Атлет-любитель', attrs: 'STR · END · MNT', on: true },
      { name: 'Менеджер проектов', attrs: 'CHR · MNT · INT', on: false },
      { name: 'Баскетболист', attrs: 'END · STR · MNT', on: false },
      { name: 'Промпт-инженер', attrs: 'INT · MNT · CHR', on: false }
    ];
    return {
      profs: list.map((p) => ({ ...p, off: !p.on, border: p.on ? '2px solid #1F2A44' : '1px solid #E3D9C6' }))
    };
  }
}
</script>
</body>
</html>
