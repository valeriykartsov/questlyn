<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5214}a:hover{color:#7A3F0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 16px 0; background: #F5F0E6; color: #1F2A44; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 13px; color: #4A5368;">Ноябрь 2026</div>
      <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; font-weight: 700;">Календарь</h1>
    </div>
    <a href="MapDay.dc.html" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid #C9BCA2; background: #FFFCF6; color: #1F2A44; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">Карта дня</a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
      <button type="button" style="height: 60px; border-radius: 12px; border: none; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Inter, sans-serif;">
        <span style="font-size: 11px; font-weight: 600;">{{d.wd}}</span>
        <span style="font-size: 17px; font-weight: 700;">{{d.n}}</span>
        <span style="width: 5px; height: 5px; background: {{d.dot}};"></span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #FFFCF6; border: 1px dashed #B8A98A;">
    <span style="font-size: 12px; font-weight: 700; color: #4A5368; width: 64px;">Весь день</span>
    <span style="width: 8px; height: 8px; background: #8E4FB5;"></span>
    <span style="font-size: 14px; flex-grow: 1;">День рождения Пети</span>
    <span style="font-size: 11px; color: #4A5368;">вне карты</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{items}}" as="e" hint-placeholder-count="8">
      <a href="{{e.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: {{e.bg}}; text-decoration: none; color: #1F2A44;">
        <span style="width: 64px; display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">{{e.t}}</span><span style="font-size: 11px; color: #4A5368;">{{e.t2}}</span></span>
        <span style="width: 8px; height: 8px; background: {{e.dot}}; border: {{e.ring}}; box-sizing: border-box;"></span>
        <span style="flex-grow: 1; font-size: 14px; text-decoration: {{e.deco}};">{{e.name}}</span>
        <span style="font-size: 11px; color: #4A5368;">{{e.src}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #E9E1D0;">
    <span style="font-size: 13px; font-weight: 600; flex-grow: 1;">Привычки дня</span>
    <span style="font-size: 13px; color: #4A5368;">1 из 3 · Бег 1 из 3 на неделе</span>
  </div>

  <div style="margin-top: auto; height: 82px; margin-left: -16px; margin-right: -16px; border-top: 1px solid #E3D9C6; background: #FFFCF6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box;">
    <a href="TodayV2.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4A5368; text-decoration: none; font-size: 11px; font-weight: 500;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Сегодня</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4A5368; text-decoration: none; font-size: 11px; font-weight: 500;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Журнал</a>
    <a href="HeroV2.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4A5368; text-decoration: none; font-size: 11px; font-weight: 500;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Герой</a>
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #1F2A44; text-decoration: none; font-size: 11px; font-weight: 600;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Календарь</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [['Пн', 9, true], ['Вт', 10, true], ['Ср', 11, false], ['Чт', 12, true], ['Пт', 13, true], ['Сб', 14, true], ['Вс', 15, false]];
    const work = '#3B5BDB', personal = '#2F6B4F';
    const ev = (t, t2, name, dot) => ({ t, t2, name, dot, ring: 'none', src: 'Apple Calendar', bg: '#FFFCF6', deco: 'none', href: 'MapDay.dc.html' });
    const q = (t, name, done) => ({ t, t2: done ? 'выполнен' : 'квест', name, dot: done ? '#2F6B4F' : 'transparent', ring: done ? 'none' : '2px solid #1F2A44', src: 'Questlyn', bg: '#FFFCF6', deco: done ? 'line-through' : 'none', href: 'QuestDetail.dc.html' });
    return {
      week: days.map(([wd, n, has]) => ({ wd, n, bg: n === 10 ? '#1F2A44' : '#FFFCF6', fg: n === 10 ? '#FFFCF6' : '#1F2A44', dot: has ? (n === 10 ? '#E2A04A' : '#B8651B') : 'transparent' })),
      items: [
        ev('09:00', '15 мин', 'Стендап', work),
        q('10:30', 'Позвонить в банк', true),
        ev('11:00', '1 ч 30 мин', 'Встреча с заказчиком', work),
        ev('13:00', '30 мин', 'Обед с Аней', personal),
        ev('15:00', '2 ч', 'Работа над отчётом', work),
        ev('16:00', '45 мин', 'Созвон с командой', work),
        q('18:00', 'Сдать отчёт по проекту', false),
        ev('19:00', '1 ч', 'Тренировка', personal)
      ]
    };
  }
}
</script>
</body>
</html>
