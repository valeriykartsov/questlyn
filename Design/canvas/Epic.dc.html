<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Epic Quest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5214}a:hover{color:#7A3F0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 50px 16px 34px; background: #F5F0E6; color: #1F2A44; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="Journal.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; gap: 2px; text-decoration: none; color: #1F2A44; font-size: 15px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Журнал</a>
    <button type="button" aria-label="Ещё действия" style="width: 44px; height: 44px; border: none; background: transparent; color: #1F2A44; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </div>

  <div style="background: #1F2A44; color: #FFFCF6; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2A04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #E2A04A;">Epic Quest</div>
    </div>
    <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.15;">Повышение до тимлида</h1>
    <div style="font-size: 14px; color: #C9CFDD; line-height: 1.45;">Цель — к марту. Разбейте её на маленькие шаги: каждый выполненный шаг двигает героя.</div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #3E4A63; overflow: hidden;"><div style="width: 43%; height: 8px; background: #E2A04A;"></div></div>
      <div style="font-size: 13px; font-weight: 700;">3 из 7</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5368;">Шаги</div>
    <sc-for list="{{open}}" as="q" hint-placeholder-count="4">
      <a href="{{q.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 12px; background: #FFFCF6; text-decoration: none; color: #1F2A44;">
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid #1F2A44; box-sizing: border-box; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 15px;">{{q.t}}</div>
        <div style="font-size: 12px; color: #4A5368;">{{q.when}}</div>
      </a>
    </sc-for>
    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; border: 1px dashed #B8A98A; background: transparent; color: #1F2A44; font: 600 15px Inter, sans-serif;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить шаг
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5368;">Выполнено · 3</div>
    <sc-for list="{{done}}" as="q" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px;">
        <div style="width: 22px; height: 22px; border-radius: 6px; background: #2F6B4F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
        <div style="flex-grow: 1; font-size: 14px; color: #4A5368; text-decoration: line-through;">{{q.t}}</div>
        <div style="font-size: 12px; color: #4A5368;">{{q.when}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      open: [
        { t: 'Сдать отчёт по проекту', when: 'Сегодня', href: 'QuestDetail.dc.html' },
        { t: 'Провести ретро команды', when: 'Чт', href: '#' },
        { t: 'Обсудить цели с руководителем', when: 'Без даты', href: '#' },
        { t: 'Пройти курс по фасилитации', when: 'Без даты', href: '#' }
      ],
      done: [
        { t: 'Взять наставничество над джуном', when: '2 ноя' },
        { t: 'Составить план развития', when: '28 окт' },
        { t: 'Провести первый демо-день', when: '15 окт' }
      ]
    };
  }
}
</script>
</body>
</html>
